name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, mbstring
      - name: Lint all PHP files
        run: |
          set -e
          find backend -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files pass php -l"
      - name: Run permission tests
        run: php backend/tests/permissions_test.php

  frontend:
    name: Frontend (React build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Production build
        run: CI=false npm run build

  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
